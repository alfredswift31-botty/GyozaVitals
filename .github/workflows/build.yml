name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release under this tag, e.g. v1.1. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      # Ad-hoc signing ("-") so CI needs no certificates. Hardened runtime is
      # off for tests only: its library validation rejects the ad-hoc test
      # bundle injected into the ad-hoc host app.
      - name: Unit tests
        run: |
          xcodebuild test \
            -project GyozaVitals.xcodeproj \
            -scheme GyozaVitals \
            -only-testing:GyozaVitalsTests \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO

      # xcodebuild's log names a failing test but not what failed in it.
      - name: Show test failures
        if: failure()
        run: |
          RESULT="$RUNNER_TEMP/UnitTests.xcresult"
          [ -d "$RESULT" ] || { echo "No test results."; exit 0; }
          xcrun xcresulttool get test-results summary --path "$RESULT" > "$RUNNER_TEMP/summary.json"
          python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          failures = summary.get("testFailures", [])
          for failure in failures:
              print(f"FAILED {failure.get('testIdentifierString') or failure.get('testName')}")
              print(f"  {failure.get('failureText')}")
          if not failures:
              print(json.dumps(summary, indent=2))
          PY

      # The snapshot tests render the real views in light and dark. CI prints
      # them as base64 JPEGs so a design change can be reviewed from the log.
      - name: Collect UI snapshots and measurements
        if: always()
        run: |
          echo "== Measurements from the real tests =="
          find "$HOME/Library/Containers" "$TMPDIR" -path '*gyozavitals-measurements*' -name '*.txt' -exec cat {} \; 2>/dev/null || true
          mkdir -p ui-snapshots
          find "$HOME/Library/Containers" "$TMPDIR" -path '*ui-snapshots*' -name '*.png' -exec cp {} ui-snapshots/ \; 2>/dev/null || true
          ls -la ui-snapshots
          for f in ui-snapshots/*.png; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .png)
            sips -Z 1400 -s format jpeg -s formatOptions 70 "$f" --out "/tmp/$name.jpg" >/dev/null
            echo "SNAPSHOT-BEGIN $name"
            base64 -i "/tmp/$name.jpg" | tr -d '\n' | fold -w 4000 | sed 's/^/SNAPSHOT-DATA /'
            echo
            echo "SNAPSHOT-END $name"
          done

      - name: Build release app
        run: |
          xcodebuild build \
            -project GyozaVitals.xcodeproj \
            -target GyozaVitals \
            -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO

      # Facts the app depends on at runtime that no unit test can see.
      - name: Verify the built app
        run: |
          APP=build/Release/GyozaVitals.app
          echo "== Menu bar app: no Dock icon =="
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$APP/Contents/Info.plist" | grep -q true || { echo "LSUIElement is not set"; exit 1; }
          echo "== Not sandboxed: reading other processes needs libproc =="
          codesign -d --entitlements - --xml "$APP" > entitlements.plist || true
          if grep -q "com.apple.security.app-sandbox" entitlements.plist; then echo "App must not be sandboxed"; exit 1; fi
          echo "== No debug entitlement: get-task-allow would let any local process attach =="
          if grep -q "get-task-allow" entitlements.plist; then echo "Release app carries get-task-allow"; exit 1; fi
          echo "== App icon =="
          test -f "$APP/Contents/Resources/AppIcon.icns" || test -f "$APP/Contents/Resources/Assets.car" \
            || { echo "No compiled app icon"; exit 1; }
          echo "== Minimum macOS =="
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"

      - name: Package
        run: |
          codesign --verify --deep --strict build/Release/GyozaVitals.app
          ditto -c -k --keepParent build/Release/GyozaVitals.app GyozaVitals.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GyozaVitals
          path: GyozaVitals.zip

  # Runs for a pushed v* tag, or a manual run given a release tag (GitHub
  # then creates the tag on the built commit).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GyozaVitals

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          TAG="${TAG_INPUT:-$GITHUB_REF_NAME}"
          gh release create "$TAG" GyozaVitals.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GyozaVitals ${TAG#v}" \
            --generate-notes
